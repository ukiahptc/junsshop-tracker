name: seo

on:
  schedule:
    - cron: "47 20 * * *"   # 매일 05:47 KST (collect 05:17 KST 이후). 예약 지연을 감안해 앞당김
  workflow_dispatch:
  push:
    paths:
      - "data/shop/*.json"
      - "data/manual/*.csv"
      - "config/*.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: seo
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: SEO 분석
        run: node scripts/seo-analyze.js
      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "seo: $(TZ=Asia/Seoul date +%Y-%m-%d) 분석"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
